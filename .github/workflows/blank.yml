name: Run Script
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install
          node cli/makefun.mjs bundle --repo https://github.com/moonspiid/the-broken-sun --out transcripts.tar.gz
